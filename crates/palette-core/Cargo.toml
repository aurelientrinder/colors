[package]
name = "palette-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "palette_core"
crate-type = ["rlib", "cdylib"]

[dependencies]
nucleo-matcher = "0.3.1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
notify = "8"
meval = "0.2"
urlencoding = "2"
# only to tell whether the NPU's plan model is compiled (planner.rs); the runtime is not loaded here
palette-ov = { path = "../palette-ov" }

[dependencies.windows]
version = "0.62"
features = [
  "Win32_UI_Controls", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_UI_Shell_Common",
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi",
  "Win32_System_Threading", "Win32_Security", "Win32_Graphics_Dwm", "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
  # quick settings (dark mode, radios, volume) and the settings index
  "Win32_System_Registry", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Globalization",
  "Devices_Radios", "Foundation_Collections",
  # the brightness slider reads and sets the built-in display over WMI
  "Win32_System_Wmi", "Win32_System_Ole",
  # requests carried out in steps (intent.rs): media keys
  "Win32_UI_Input_KeyboardAndMouse",
  # the plan model's helper process ends with the launcher (planner.rs)
  "Win32_System_JobObjects",
  # reading the window in front: its selected text and its commands (uia.rs)
  "Win32_UI_Accessibility",
  # answers about the PC itself (pcinfo.rs): listening ports, programs holding a file open
  "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_RestartManager",
  # unit, date and time-zone conversions (convert.rs)
  "Win32_System_Time", "Win32_System_SystemInformation",
]
