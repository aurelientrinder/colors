[package]
name = "palette-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "palette_core"
crate-type = ["rlib", "cdylib"]

[dependencies]
nucleo-matcher = "0.3.1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
notify = "8"
meval = "0.2"
urlencoding = "2"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_UI_Controls", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_UI_Shell_Common",
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi",
  "Win32_System_Threading", "Win32_Security",
]
