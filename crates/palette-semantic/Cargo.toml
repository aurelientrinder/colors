[package]
name = "palette-semantic"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "palette-semantic"
path = "src/main.rs"

[dependencies]
lopdf = "0.42"
pdf-extract = "0.12.1"
ort = "=2.0.0-rc.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
zip = "9.0.2"

[dependencies.windows]
version = "0.62"
features = ["Win32_System_Threading", "Win32_System_Power", "Win32_Foundation"]
